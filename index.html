<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="utf-8">
<title>Le Mas de Vignal</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Le Mas de Vignal is een luxueuze vakantievilla voor 12 personen in Le Vignal, in de zuidelijke Ardèche. Met privézwembad (10m x 5m), panoramisch uitzicht over de groene vallei, olijfgaard, pétanqueplein en buitenkeuken.">
<meta name="keywords" content="Le Vignal, Ardèche, Ardeche, Vakantiewoning, Reserveren, boeken, villa, le mas de vignal, piscine, zwembad, 12 personen, Les Vans, Likoké">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Palette & base ---------- */
:root{
  --cream:#F7F2E9;
  --cream-2:#EFE7D7;
  --panel:#FBF7EE;
  --ink:#2B2722;
  --ink-soft:#574F44;
  --muted:#867C6C;
  --olive:#5E6347;
  --olive-dark:#4C5139;
  --clay:#A87650;
  --dark:#26261F;
  --line:rgba(43,39,34,.10);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',-apple-system,Segoe UI,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:76px;}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;}
img{display:block;}
a{color:inherit;}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(18px,5vw,48px);}
.eyebrow{font-family:var(--sans);font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--clay);margin:0 0 16px;}
.title{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5vw,56px);line-height:1.04;letter-spacing:-.01em;color:var(--ink);margin:0;}
.lead{font-family:var(--sans);font-weight:300;font-size:clamp(16px,1.6vw,19px);line-height:1.8;color:#4F473C;margin:0;}
section{padding:clamp(64px,9vw,124px) 0;}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:100;background:rgba(247,242,233,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.bar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0;}
.brand-logo{height:36px;width:auto;display:block;}
.brand span{font-family:var(--sans);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--clay);}
nav.main{display:flex;align-items:center;gap:30px;}
nav.main a{font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none;padding-bottom:2px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s;}
nav.main a:hover{color:var(--olive);border-bottom-color:var(--olive);}
.actions{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.langs{display:flex;align-items:center;gap:10px;}
.langs button{background:none;border:none;cursor:pointer;font-family:var(--sans);font-size:13px;letter-spacing:.08em;padding:4px 1px;color:#A89E8C;border-bottom:1.5px solid transparent;}
.langs button.active{color:var(--ink);font-weight:600;border-bottom-color:var(--olive);}
.burger{display:none;flex-direction:column;gap:4px;background:none;border:none;cursor:pointer;padding:8px 4px;}
.burger span{display:block;width:22px;height:1.5px;background:var(--ink);}
nav.mobile{display:none;flex-direction:column;border-top:1px solid rgba(43,39,34,.08);background:rgba(247,242,233,.98);padding:8px 0;}
nav.mobile a{font-family:var(--sans);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none;padding:14px clamp(18px,5vw,48px);}
header.open nav.mobile{display:flex;}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:clamp(520px,86vh,860px);display:flex;align-items:flex-end;
  background-image:linear-gradient(180deg,rgba(18,15,11,.42) 0%,rgba(18,15,11,.30) 32%,rgba(14,12,9,.72) 100%),url("images/header3.jpg");
  background-size:cover;background-position:center;padding:0;}
.hero .wrap{padding-top:0;padding-bottom:clamp(48px,8vw,96px);width:100%;}
.hero-content{position:relative;z-index:0;display:inline-block;max-width:100%;box-sizing:border-box;padding:clamp(22px,3.4vw,38px) clamp(24px,3.8vw,42px);}
.hero-content::before{content:'';position:absolute;inset:-10%;z-index:-1;pointer-events:none;
  background:rgba(15,13,10,.4);
  backdrop-filter:blur(22px) saturate(1.15);-webkit-backdrop-filter:blur(22px) saturate(1.15);
  -webkit-mask-image:radial-gradient(ellipse 68% 72% at 50% 50%,#000 40%,transparent 100%);
  mask-image:radial-gradient(ellipse 68% 72% at 50% 50%,#000 40%,transparent 100%);}
.hero .kicker{font-family:var(--sans);font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#EAD9C5;margin:0 0 18px;text-shadow:0 1px 12px rgba(0,0,0,.4);}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5.5vw,72px);line-height:1;letter-spacing:-.01em;color:#FBF6EC;margin:0;max-width:14ch;}
.hero p{font-family:var(--sans);font-weight:300;font-size:clamp(16px,2vw,22px);line-height:1.5;color:#F8F1E6;margin:22px 0 34px;max-width:46ch;text-shadow:0 1px 14px rgba(0,0,0,.35);}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--sans);font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:16px 30px;border-radius:2px;text-decoration:none;transition:background .25s,color .25s;}
.btn-light{background:var(--cream);color:var(--ink);}
.btn-light:hover{background:var(--olive);color:var(--cream);}

/* ---------- Welcome ---------- */
.center-head{text-align:center;max-width:760px;margin:0 auto;}
.center-head .title{margin-bottom:26px;}
.welcome-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(32px,5vw,64px);align-items:center;margin-top:clamp(48px,6vw,80px);}
.welcome-grid .photo{border-radius:3px;overflow:hidden;}
.welcome-grid .photo img{width:100%;height:100%;min-height:340px;object-fit:cover;}
.welcome-grid p{font-family:var(--sans);font-size:clamp(15px,1.4vw,17px);line-height:1.78;color:var(--ink-soft);margin:0 0 18px;}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 28px;}
.chips span{font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;color:var(--olive);border:1px solid rgba(94,99,71,.4);border-radius:100px;padding:7px 15px;}
.morelink{font-family:var(--sans);font-size:14px;letter-spacing:.04em;color:var(--clay);text-decoration:none;border-bottom:1px solid rgba(168,118,74,.5);padding-bottom:2px;}

/* ---------- Gallery ---------- */
#gallery{background:var(--cream-2);}
.head-c{text-align:center;margin-bottom:clamp(40px,5vw,64px);}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;}
.gal-grid .cell{aspect-ratio:4/3;overflow:hidden;border-radius:2px;cursor:pointer;background:#ddd;}
.gal-grid img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
.gal-grid .cell:hover img{transform:scale(1.06);}

/* ---------- Surroundings ---------- */
.surr-intro{text-align:center;max-width:740px;margin:0 auto clamp(44px,6vw,72px);}
.surr-intro .title{margin-bottom:24px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(24px,3vw,40px);}
.card{background:var(--panel);border:1px solid rgba(43,39,34,.07);border-radius:3px;overflow:hidden;transition:transform .35s ease,box-shadow .35s ease;}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px -22px rgba(43,39,34,.4);}
.card .ph{aspect-ratio:16/10;overflow:hidden;background:#ddd;}
.card .ph img{width:100%;height:100%;object-fit:cover;}
.card .body{padding:26px 26px 30px;}
.card h3{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.15;color:var(--ink);margin:0 0 12px;}
.card p{font-family:var(--sans);font-size:14.5px;line-height:1.7;color:#5E5648;margin:0;}

/* ---------- Booking ---------- */
#booking{background:var(--dark);color:#F1E9DB;}
#booking .center-head .title{color:#FBF6EC;}
#booking .eyebrow{color:#C79A6E;}
#booking .lead{color:#D8CDBA;}
.book-list{display:flex;flex-direction:column;gap:22px;margin-top:clamp(40px,5vw,60px);}
.book-row{display:flex;flex-wrap:wrap;gap:clamp(20px,3vw,40px);align-items:center;justify-content:space-between;background:#2F2F26;border:1px solid rgba(241,233,219,.12);border-radius:4px;padding:clamp(22px,3vw,34px);}
.book-row .info{flex:1 1 240px;min-width:220px;}
.book-row h3{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;color:#FBF6EC;margin:0 0 6px;}
.book-row .sub{font-family:var(--sans);font-size:14px;letter-spacing:.03em;color:#BCB199;margin:0 0 22px;}
.btn-gold{background:#C79A6E;color:var(--dark);font-weight:500;}
.btn-gold:hover{background:#D8B488;}
.cal{flex:1 1 300px;min-width:240px;max-width:550px;}
.cal-tag{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C79A6E;margin:0 0 10px;}
.cal-viewport{position:relative;width:100%;overflow:hidden;}
.cal-frame{position:absolute;top:0;left:0;width:550px;height:300px;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 14px 32px -16px rgba(0,0,0,.55);border:1px solid rgba(241,233,219,.15);transform-origin:top left;}
.cal-frame iframe{display:block;border:none;width:550px;height:300px;}

/* ---------- Documents + weather ---------- */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(40px,6vw,80px);align-items:start;}
.doc-grid .title{font-size:clamp(30px,4vw,46px);margin-bottom:30px;}
.docs{display:flex;flex-direction:column;}
.docs a{display:flex;align-items:baseline;gap:14px;padding:18px 0;border-top:1px solid rgba(43,39,34,.12);text-decoration:none;color:var(--ink);transition:padding-left .2s;}
.docs a:hover{padding-left:6px;}
.docs .tag{font-family:var(--sans);font-size:12px;letter-spacing:.18em;color:var(--clay);flex-shrink:0;}
.docs .dt{flex:1;}
.docs .dt b{display:block;font-family:var(--sans);font-size:16px;font-weight:500;color:var(--ink);}
.docs .dt small{display:block;font-family:var(--sans);font-size:13.5px;color:var(--muted);margin-top:3px;}
.docs .arr{color:var(--clay);flex-shrink:0;}
.weather-box{background:var(--panel);border:1px solid rgba(43,39,34,.08);border-radius:4px;padding:22px 24px;display:block;max-width:320px;}
.weather-status{font-family:var(--sans);font-size:13.5px;color:var(--muted);margin:0;}
.weather-now{display:flex;align-items:center;gap:16px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid rgba(43,39,34,.10);}
.weather-now .icon{width:42px;height:42px;color:var(--clay);flex-shrink:0;}
.weather-now .now-tag{font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);margin:0 0 4px;}
.weather-now .temp{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--ink);line-height:1;}
.weather-now .desc{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:4px;}
.weather-days{display:flex;gap:4px;justify-content:space-between;}
.weather-day{flex:1;text-align:center;}
.weather-day .d{font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.weather-day .icon{width:20px;height:20px;color:var(--olive);margin:0 auto 8px;}
.weather-day .hi{font-family:var(--sans);font-size:13px;color:var(--ink);font-weight:500;}
.weather-day .lo{font-family:var(--sans);font-size:11.5px;color:var(--muted);}

/* ---------- Contact ---------- */
#contact{background:var(--cream-2);}
.contact-in{max-width:880px;margin:0 auto;text-align:center;}
.contact-in .lead{margin:0 auto 40px;max-width:48ch;}
.contact-rows{display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,56px);justify-content:center;}
.contact-rows a{text-decoration:none;color:var(--ink);}
.contact-rows small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--clay);margin-bottom:8px;}
.contact-rows b{font-family:var(--serif);font-size:clamp(24px,3vw,32px);font-weight:500;}

/* ---------- Footer ---------- */
footer{background:var(--dark);color:#9A917F;padding:34px 0;}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;}
footer .fbrand{font-family:var(--serif);font-size:18px;color:#E8DFCD;}
footer .frt{font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;}

/* ---------- Lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(20,17,13,.94);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
.lightbox.open{display:flex;animation:fadein .25s ease;}
.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:3px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  nav.main{display:none;}
  .burger{display:flex;}
}
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap bar">
    <a class="brand" href="#top"><img class="brand-logo" src="images/masdevignal_website.png" alt="Le Mas de Vignal"><span>Ardèche</span></a>
    <nav class="main" id="navMain"></nav>
    <div class="actions">
      <div class="langs" id="langs">
        <button data-lang="nl">NL</button>
        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>

</header>

<main id="top">

  <!-- HERO -->
  <section class="hero" style="padding:0;">
    <div class="wrap">
      <div class="hero-content">
        <p class="kicker">Ardèche · France</p>

  </section>

  <!-- WELCOME -->
  <section id="welcome">
    <div class="wrap">
      <div class="center-head">
        <p class="eyebrow" id="wEyebrow"></p>

        <p class="lead" id="wLead"></p>
      </div>
      <div class="welcome-grid">
        <div class="photo"><img src="images/huis/huis.jpg" alt="Le Mas de Vignal"></div>
        <div>
          <div id="wParas"></div>
          <div class="chips" id="amenities"></div>
          <a class="morelink" id="wMore" href="documenten/huisindeling_nl.pdf" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- GALLERY -->
  <section id="gallery">
    <div class="wrap">
      <div class="head-c">
        <p class="eyebrow" id="gEyebrow"></p>
        <h2 class="title" id="gTitle"></h2>
      </div>
      <div class="gal-grid" id="gGrid"></div>
    </div>
  </section>

  <!-- SURROUNDINGS -->
  <section id="surroundings">
    <div class="wrap">
      <div class="surr-intro">
        <p class="eyebrow" id="sEyebrow"></p>
        <h2 class="title" id="sTitle"></h2>
        <p class="lead" id="sIntro"></p>
      </div>
      <div class="cards" id="sGrid"></div>
    </div>
  </section>

  <!-- BOOKING -->
  <section id="booking">
    <div class="wrap">
      <div class="center-head">
        <p class="eyebrow" id="bEyebrow"></p>
        <h2 class="title" id="bTitle"></h2>
        <p class="lead" id="bIntro"></p>
      </div>
      <div class="book-list" id="bList"></div>
    </div>
  </section>

  <!-- DOCUMENTS + WEATHER -->
  <section id="documents">
    <div class="wrap doc-grid">
      <div>
        <p class="eyebrow" id="dEyebrow"></p>
        <h2 class="title" id="dTitle"></h2>
        <div class="docs" id="dList"></div>
      </div>
      <div>
        <p class="eyebrow" id="weEyebrow"></p>
        <h2 class="title" id="weTitle"></h2>
        <div class="weather-box" id="weatherBox">
          <p class="weather-status" id="weatherStatus"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <div class="wrap contact-in">
      <p class="eyebrow" id="cEyebrow"></p>
      <h2 class="title" id="cTitle"></h2>
      <p class="lead" id="cLead"></p>
      <div class="contact-rows">
        <a href="tel:+32476247863"><small id="cPhoneLabel"></small><b>+32 476 247 863</b></a>
        <a href="mailto:ardechevakantie@gmail.com"><small id="cEmailLabel"></small><b>ardechevakantie@gmail.com</b></a>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <span class="fbrand">Le Mas de Vignal</span>
    <span class="frt" id="fRights"></span>
  </div>
</footer>

<div class="lightbox" id="lightbox"><img src="" alt="Le Mas de Vignal" id="lightboxImg"></div>

function weatherCategory(code, isDay){
  if(code===0) return isDay===0 ? 'night' : 'sunny';
  if(code===1||code===2) return 'partly';
  if(code===3) return 'cloudy';
  if(code===45||code===48) return 'fog';
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].indexOf(code)>-1) return 'rain';
  if([71,73,75,77,85,86].indexOf(code)>-1) return 'snow';
  if([95,96,99].indexOf(code)>-1) return 'storm';
  return 'cloudy';
}
var weatherData = null, weatherFailed = false, currentLang = 'nl';
function fetchWeather(){
  var url = 'https://api.open-meteo.com/v1/forecast?latitude='+WEATHER_LAT+'&longitude='+WEATHER_LON+
    '&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5';
  fetch(url).then(function(r){ if(!r.ok) throw new Error('bad response'); return r.json(); })
    .then(function(data){ weatherData = data; renderWeather(currentLang); })
    .catch(function(){ weatherFailed = true; renderWeather(currentLang); });
}
function renderWeather(lang){
  var box = $('weatherBox');
  if(!box) return;
  var t = (I18N[lang] || I18N.nl).weather;
  if(weatherFailed){ box.innerHTML = '<p class="weather-status">'+t.unavailable+'</p>'; return; }
  if(!weatherData){ box.innerHTML = '<p class="weather-status">'+t.loading+'</p>'; return; }
  var locale = lang==='nl' ? 'nl-BE' : (lang==='fr' ? 'fr-FR' : 'en-GB');
  var fmt = new Intl.DateTimeFormat(locale, {weekday:'short'});
  var cur = weatherData.current, daily = weatherData.daily;
  var curCat = weatherCategory(cur.weather_code, cur.is_day);
  var html = '<div class="weather-now"><div class="icon">'+WEATHER_ICONS[curCat]+'</div><div>'+
    '<div class="now-tag">'+t.now+'</div>'+
    '<div class="temp">'+Math.round(cur.temperature_2m)+'°</div>'+
    '<div class="desc">'+t[curCat]+'</div></div></div><div class="weather-days">';
  for(var i=0;i<daily.time.length;i++){
    var cat = weatherCategory(daily.weather_code[i]);
    var label = fmt.format(new Date(daily.time[i]+'T12:00:00'));
    html += '<div class="weather-day"><div class="d">'+label+'</div><div class="icon">'+WEATHER_ICONS[cat]+'</div>'+
      '<div class="hi">'+Math.round(daily.temperature_2m_max[i])+'°</div>'+
      '<div class="lo">'+Math.round(daily.temperature_2m_min[i])+'°</div></div>';
  }
  box.innerHTML = html + '</div>';
}

function openLightbox(src){ var lb = $('lightbox'); $('lightboxImg').src = src; lb.classList.add('open'); }
function closeLightbox(){ $('lightbox').classList.remove('open'); $('lightboxImg').src=''; }

function fitCalendars(){
  document.querySelectorAll('.cal-viewport').forEach(function(vp){
    var frame = vp.querySelector('.cal-frame');
    if(!frame) return;
    var scale = Math.min(1, vp.clientWidth / 550);
    frame.style.transform = 'scale('+scale+')';
    vp.style.height = (300*scale)+'px';
  });
}

      container.appendChild(a);

  make($('navMain')); make($('navMobile'));
}

  $('weEyebrow').textContent = t.weEyebrow; $('weTitle').textContent = t.weTitle;
